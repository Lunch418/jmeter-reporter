[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jmeter-reporter"
dynamic = ["version"]
description = "JMeter JTL -> Excel report, SLA verdict, run comparison"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.0.10,<3.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
tui = ["textual>=0.86"]

# pip install .  ->  jmeter-report / jmeter-report-cli / jmeter-report-tui.
# Running from a checkout (python convert.py ...) keeps working, and so does the
# stdlib-only mode of cli.py (see docs/OFFLINE.md).
[project.scripts]
jmeter-report = "jmeter_reporter.convert:main"
jmeter-report-cli = "jmeter_reporter.cli:main"
jmeter-report-tui = "jmeter_reporter.tui:main"

[tool.setuptools]
packages = ["jmeter_reporter"]

[tool.setuptools.dynamic]
version = { attr = "jmeter_reporter.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = [".venv", "venv", "docs", "samples"]

[tool.ruff.lint]
# Real bugs only (syntax errors, undefined names, unused imports/variables): no style churn.
select = ["E9", "F"]
