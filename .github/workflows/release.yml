name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write       # build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
      - name: Tag must match version.py
        run: |
          v=$(python -c "from jmeter_reporter import version; print(version.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}"
      - name: Breaking changes need a new major version
        run: python tools/changelog_section.py --check "${GITHUB_REF_NAME}"
      - name: Build offline bundle
        run: |
          for v in 3.10 3.11 3.12 3.13; do
            python tools/make_offline_bundle.py --with-tui --python-version "$v"
          done
      - name: Checksums (separate file, outside the zips)
        run: cd dist && sha256sum *.zip > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Release notes
        run: python tools/changelog_section.py "${GITHUB_REF_NAME}" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS --title "${GITHUB_REF_NAME}" --notes-file notes.md
