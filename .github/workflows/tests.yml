name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q --cov=convert --cov=tui --cov=verify --cov=preview --cov=stats --cov=sla --cov=compare --cov=export --cov=config --cov=workflow --cov=cli --cov=tools
